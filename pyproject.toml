[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fastscipy"
version = "0.1.0a4"
description = "Portable acceleration for SciPy with compatible results and shared thread pools"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/scipy-LICENSE.txt"]
authors = [{ name = "Michael Li" }]
requires-python = ">=3.12,<3.16"
dependencies = ["numpy>=2.5,<2.6", "scipy>=1.18,<1.19"]
keywords = ["scipy", "performance", "rust", "multithreading", "drop-in", "ndimage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/michael-L-i/fastscipy"
Source = "https://github.com/michael-L-i/fastscipy"
Issues = "https://github.com/michael-L-i/fastscipy/issues"
Benchmarks = "https://github.com/michael-L-i/fastscipy/blob/main/bench/RESULTS.md"

[project.optional-dependencies]
test = ["pytest", "pytest-xdist", "hypothesis"]
bench = ["pillow>=10.1"]
gallery = ["pillow>=10.1", "matplotlib>=3.8"]

[tool.maturin]
python-source = "python"
module-name = "fastscipy._native"
include = [{ path = "LICENSES/scipy-LICENSE.txt", format = ["wheel", "sdist"] }]
exclude = [{ path = "bench/**", format = "sdist" }, { path = "examples/**", format = "sdist" }, { path = "docs/**", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# Tests call their lambdas immediately (B023); kernels mirror SciPy's terse style (E70x, E731).
ignore = ["B023", "B905", "B008", "E701", "E702", "E731"]

