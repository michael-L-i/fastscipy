name: Platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: "all, or comma-separated linux-arm64,linux-x86_64,windows-x86_64,windows-arm64,macos-x86_64,macos-arm64"
        default: all
        type: string
      mode:
        description: "Validation to run"
        type: choice
        default: full
        options: [full, tests, bench, diagnostics]
      wheel_run:
        description: "Diagnostics only: reuse this run's platform wheel artifact instead of building"
        default: ""
        type: string
      probes:
        description: "Diagnostics only: all, or comma-separated probe script names without .py"
        default: all
        type: string
      upstream:
        description: "Also compare the full upstream SciPy suite"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: platforms-${{ github.ref }}-${{ inputs.platforms }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_RELEASE_CODEGEN_UNITS: "4"
  FASTSCIPY_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  FASTSCIPY_ANY_PLATFORM: "1"
  RUSTFLAGS: ""
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          REQUESTED: ${{ inputs.platforms || 'all' }}
          MODE: ${{ inputs.mode || 'full' }}
          WHEEL_RUN: ${{ inputs.wheel_run }}
          UPSTREAM: ${{ inputs.upstream }}
          PROBES: ${{ inputs.probes || 'all' }}
        run: |
          python - <<'PY'
          import json, os
          wheel_run = os.environ["WHEEL_RUN"]
          assert not wheel_run or (os.environ["MODE"] == "diagnostics" and wheel_run.isdecimal()), "wheel_run requires mode=diagnostics and a numeric run ID"
          assert os.environ["MODE"] != "diagnostics" or os.environ["UPSTREAM"] != "true", "diagnostics cannot request upstream validation"
          assert os.environ["PROBES"] == "all" or os.environ["MODE"] == "diagnostics", "probe selection requires diagnostics mode"
          targets = [
              {"name": "linux-arm64", "os": "ubuntu-24.04-arm"},
              {"name": "linux-x86_64", "os": "ubuntu-24.04"},
              {"name": "windows-x86_64", "os": "windows-2025"},
              {"name": "windows-arm64", "os": "windows-11-arm"},
              {"name": "macos-x86_64", "os": "macos-15-intel"},
              {"name": "macos-arm64", "os": "macos-15"},
          ]
          requested = {x.strip() for x in os.environ["REQUESTED"].split(",")}
          assert requested == {"all"} or requested <= {t["name"] for t in targets}, requested
          selected = [t for t in targets if requested == {"all"} or t["name"] in requested]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": selected}) + "\n")
          PY

  test:
    needs: matrix
    name: ${{ matrix.name }} / Python 3.13${{ inputs.mode == 'diagnostics' && ' / diagnostics' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      BUILD_PROFILE: ${{ (matrix.name == 'windows-x86_64' || matrix.name == 'macos-x86_64') && 'release' || 'dev-release' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.97.1
        if: ${{ !inputs.wheel_run }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.wheel_run }}
        with:
          cache-on-failure: true
      - name: Install tools
        run: |
          python -m pip install "maturin>=1.9,<2" pytest pytest-xdist hypothesis packaging psutil pooch
          python -m pip install --only-binary=:all: "numpy==2.5.4" "scipy==1.18.1"
      - name: Build and install
        if: ${{ !inputs.wheel_run }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          from tools.platform_suite import run
          Path("artifacts").mkdir(exist_ok=True)
          profile = os.environ["BUILD_PROFILE"]
          result = run(["maturin", "build", "--profile", profile, "--locked", "--out", "dist/platform", "--interpreter", sys.executable], Path("artifacts/build.log"), 6144, 10800)
          result.update(profile=profile, codegen_units=8 if profile == "release" else 4, lto="thin" if profile == "release" else False)
          Path("artifacts/build.json").write_text(json.dumps(result, indent=2))
          sys.exit(result["returncode"])
          PY
          python -m pip install --only-binary=:all: dist/platform/*.whl
      - name: Download prior wheel for diagnostics only
        if: ${{ inputs.wheel_run }}
        uses: actions/download-artifact@v4
        with:
          name: platform-${{ matrix.name }}-py313
          run-id: ${{ inputs.wheel_run }}
          github-token: ${{ github.token }}
          path: prior-wheel
      - name: Install prior wheel for diagnostics only
        if: ${{ inputs.wheel_run }}
        run: |
          python -m pip install --only-binary=:all: prior-wheel/dist/platform/*.whl
      - name: Record wheel and source provenance
        if: always()
        env:
          MODE: ${{ inputs.mode || 'full' }}
          WHEEL_RUN: ${{ inputs.wheel_run }}
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.name }}
        run: |
          python - <<'PY'
          import importlib.metadata, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          wheel_run = os.environ["WHEEL_RUN"]
          data = {
              "purpose": "diagnostics_only" if os.environ["MODE"] == "diagnostics" else "validation",
              "mode": os.environ["MODE"],
              "target": os.environ["TARGET"],
              "checkout_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "wheel_reused": bool(wheel_run),
              "wheel_artifact_run_id": wheel_run or os.environ["GITHUB_RUN_ID"],
              "wheel_artifact_run_head_sha": os.environ["GITHUB_SHA"] if not wheel_run else None,
          }
          if wheel_run:
              url = f'{os.environ["GITHUB_API_URL"]}/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{wheel_run}'
              request = Request(url, headers={"Authorization": f'Bearer {os.environ["GH_TOKEN"]}', "Accept": "application/vnd.github+json"})
              try:
                  with urlopen(request, timeout=20) as response:
                      source = json.load(response)
                  data["wheel_artifact_run_head_sha"] = source["head_sha"]
                  data["wheel_artifact_run_url"] = source["html_url"]
              except Exception as error:
                  data["provenance_error"] = str(error)
          try:
              data["installed_wheel_version"] = importlib.metadata.version("fastscipy")
          except importlib.metadata.PackageNotFoundError:
              data["installed_wheel_version"] = None
          directory = Path("prior-wheel/dist/platform" if wheel_run else "dist/platform")
          data["wheel_files"] = [p.name for p in sorted(directory.glob("*.whl"))]
          build_report = Path("prior-wheel/artifacts/build.json" if wheel_run else "artifacts/build.json")
          build = json.loads(build_report.read_text(encoding="utf-8")) if build_report.exists() else {}
          data["wheel_build_profile"] = build.get("profile")
          data["wheel_build_codegen_units"] = build.get("codegen_units")
          data["wheel_build_lto"] = build.get("lto")
          data["wheel_build_returncode"] = build.get("returncode")
          data["wheel_build_stopped"] = build.get("stopped")
          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/provenance.json").write_text(json.dumps(data, indent=2), encoding="utf-8")
          print(json.dumps(data, indent=2))
          if data["purpose"] == "diagnostics_only":
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
                  stream.write("## Diagnostics only\n\nThis run does not validate the current source or a release wheel.\n\n")
                  stream.write(f'Wheel artifact run: {data["wheel_artifact_run_id"]}; source head: `{data["wheel_artifact_run_head_sha"]}`; installed version: `{data["installed_wheel_version"]}`.\n')
          if "provenance_error" in data:
              raise SystemExit("Cannot establish the reused wheel's source provenance")
          PY
      - name: Platform diagnostics
        if: ${{ inputs.mode != 'diagnostics' }}
        run: python tools/probe_ndimage_platform.py
      - name: Bounded diagnostics only
        if: ${{ inputs.mode == 'diagnostics' }}
        env:
          PROBES: ${{ inputs.probes || 'all' }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          from tools.platform_suite import run
          Path("artifacts").mkdir(exist_ok=True)
          results = {}
          available = {p.stem: p for p in Path("tools").glob("probe_*_platform.py")}
          requested = {p.strip() for p in os.environ["PROBES"].split(",")}
          assert requested == {"all"} or requested and requested <= available.keys(), "Unknown or empty diagnostic selection"
          selected = sorted(available) if requested == {"all"} else sorted(requested)
          for name in selected:
              probe = available[name]
              # Leave overhead headroom beyond each overlay's inner watchdog.
              budgets = {"probe_python_source_platform": (4096, 2460), "probe_python_remaining_platform": (4096, 1260)}
              memory, timeout = budgets.get(name, (1024, 120))
              results[probe.stem] = run([sys.executable, str(probe)], Path("artifacts") / f"{probe.stem}.log", memory, timeout)
              Path("artifacts/diagnostics.json").write_text(json.dumps(results, indent=2), encoding="utf-8")
          sys.exit(any(result["returncode"] for result in results.values()))
          PY
      - name: Correctness and all-area benchmarks
        if: ${{ inputs.mode != 'diagnostics' }}
        env:
          MODE: ${{ inputs.mode || 'full' }}
          UPSTREAM: ${{ inputs.upstream }}
        run: |
          args=()
          if [ "$MODE" = "tests" ]; then args+=(--tests-only); fi
          if [ "$MODE" = "bench" ]; then args+=(--bench-only); fi
          if [ "$UPSTREAM" = "true" ]; then args+=(--upstream); fi
          python tools/platform_suite.py --output artifacts/platform --max-rss-mb 4096 "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.mode == 'diagnostics' && 'platform-diagnostics' || 'platform' }}-${{ matrix.name }}-py313
          path: |
            artifacts/
            dist/platform/*.whl
          if-no-files-found: warn
          retention-days: 14
