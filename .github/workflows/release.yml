name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Destination (none only builds and verifies artifacts)"
        type: choice
        options: [none, testpypi, pypi]
        default: none

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  FASTSCIPY_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  RUSTFLAGS: ""
  RELEASE_TARGET: ${{ inputs.publish || 'pypi' }}

jobs:
  wheels:
    name: Wheel / Python ${{ matrix.python }}
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install build tools
        run: python -m pip install "maturin>=1.9,<2" twine pytest hypothesis
      - name: Check versions and architecture
        run: |
          python tools/check_release.py
          python -c "import platform; assert platform.machine() == 'arm64'"
      - name: Build release wheel from source distribution
        run: maturin build --release --locked --sdist --out dist --interpreter python
      - name: Check package contents and PyPI metadata
        run: |
          python tools/check_release.py --dist dist
          python -m twine check --strict dist/*
      - name: Install the wheel
        run: |
          python -m pip install --only-binary=:all: dist/*.whl
      - name: Verify installed wheel
        run: python -I tools/check_release.py --installed
      - name: Identity suite against installed wheel
        run: python -m pytest tests -q --tb=short
      - name: Upstream comparison
        if: matrix.python == '3.13'
        run: |
          python -m pip install pytest-xdist pooch
          python tools/scipy_suite.py --pyargs scipy -n 2
      - name: Keep one source distribution
        if: matrix.python != '3.13'
        run: rm dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  testpypi:
    needs: wheels
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish == 'pypi')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
