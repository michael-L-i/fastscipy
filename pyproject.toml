[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "fastscipy"
version = "0.1.0"
description = "Drop-in acceleration for SciPy: byte-identical results, faster on one core and on many"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Michael Li" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.18"]
keywords = ["scipy", "performance", "rust", "multithreading", "drop-in", "ndimage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/michael-L-i/fastscipy"
Source = "https://github.com/michael-L-i/fastscipy"
Issues = "https://github.com/michael-L-i/fastscipy/issues"
Benchmarks = "https://github.com/michael-L-i/fastscipy/blob/main/bench/RESULTS.md"

[project.optional-dependencies]
test = ["pytest", "pytest-xdist", "hypothesis"]
bench = ["matplotlib"]

[tool.maturin]
python-source = "python"
module-name = "fastscipy._native"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# Tests call their lambdas immediately (B023); kernels mirror SciPy's terse style (E70x, E731).
ignore = ["B023", "B905", "B008", "E701", "E702", "E731"]

