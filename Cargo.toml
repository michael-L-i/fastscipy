[package]
name = "fastscipy"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Drop-in accelerators for SciPy"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "thin"          # fat LTO with one codegen unit needs more than 6 GB to link
codegen-units = 8
panic = "abort"
strip = "symbols"

# Fast rebuilds while developing: `maturin develop --profile dev-release`.
[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
